<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Espace client · Bab Digital</title>
<link rel="icon" href="/logo-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--g:#0F5C4D;--t:#C8553D;--c:#F6F0E6;--ink:#14141A;--line:#E4DCCD;--mut:#66666C;--tint:#E3ECE5;--ok:#1a8f57;--okbg:#e2f3e9;--warn:#a5650f;--warnbg:#fbefd9}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--c);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
[dir=rtl] body,[dir=rtl] .h{font-family:Tajawal,Inter,sans-serif}
a{color:inherit}
.h{font-family:Sora,Inter,sans-serif}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,3vw,36px);border-bottom:1px solid var(--line);background:#fbf8f2;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;text-decoration:none}
.brand img{width:26px;height:30px}
.brand span{font:500 13px Inter;color:var(--mut)}
.who{display:flex;align-items:center;gap:12px;color:var(--mut);font-weight:500}
.lang{min-height:38px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;font:600 14px Inter;cursor:pointer;color:var(--ink)}
.av{width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:700 14px Sora;text-transform:uppercase}
.wrap{max-width:1380px;margin:0 auto;padding:clamp(20px,3vw,32px) clamp(16px,3vw,36px) 48px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.head small{color:var(--mut);font-weight:500}
.head h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.b{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:8px;font:600 14.5px Inter;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s}
.b:hover{transform:translateY(-1px)}
.b.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.b.wa{background:var(--t);color:#fff;border-color:var(--t)}
.b svg{width:17px;height:17px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px}
.main{padding:20px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px}
.prev{position:relative;border-radius:14px;overflow:hidden;background:#eee6d8;border:1px solid var(--line);aspect-ratio:16/10.5}
.prev .stage{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.prev .frame{transform-origin:top center;background:#fff;border:0;flex:none;transition:width .3s}
.prev.phone .frame{border-radius:28px;box-shadow:0 0 0 10px #14141a;margin-top:18px}
.prev.phone .stage{background:radial-gradient(circle at 50% 30%,#f3ece0,#e5dccb)}
.devs{position:absolute;top:12px;inset-inline-end:12px;display:flex;gap:4px;background:rgba(255,255,255,.95);border-radius:999px;padding:4px;z-index:3;box-shadow:0 4px 14px -6px rgba(0,0,0,.25)}
.devs button{width:38px;height:34px;border-radius:999px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.devs button svg{width:18px;height:18px}
.devs button[aria-pressed=true]{background:var(--ink);color:#fff}
.open{position:absolute;bottom:12px;inset-inline-end:12px;z-index:3}
.info{display:flex;flex-direction:column;gap:18px;min-width:0}
.lab{color:var(--mut);font-size:13px;font-weight:500;margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.val{font-weight:600}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--okbg)}
.dot.demo{background:#3b6fd6;box-shadow:0 0 0 4px #e1e9fa}
.dot.build{background:#d99a1c;box-shadow:0 0 0 4px var(--warnbg)}
.tag{font-size:12px;background:var(--tint);color:var(--g);padding:3px 9px;border-radius:999px;font-weight:600;margin-inline-start:6px}
.dom{display:flex;align-items:center;gap:10px;font-weight:600;padding:10px 0;border-bottom:1px dashed var(--line);min-width:0}
.dom:last-child{border:0}
.dom a{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dom a:hover{text-decoration:underline}
.dom small{margin-inline-start:auto;font-weight:600;font-size:12.5px;white-space:nowrap;padding:3px 9px;border-radius:999px}
.s-active{color:var(--ok);background:var(--okbg)}.s-pending{color:var(--warn);background:var(--warnbg)}.s-demo{color:#2f5fc4;background:#e1e9fa}
.ico{flex:none;width:30px;height:30px;border-radius:8px;background:var(--tint);color:var(--g);display:grid;place-items:center}
.ico svg{width:16px;height:16px}
.side{display:flex;flex-direction:column;gap:20px}
.box{padding:18px 20px}
.box h3{font-size:15.5px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font:600 12px Inter;padding:3px 9px;border-radius:999px}
.price{font:700 28px Sora}
.price small{font:500 13px Inter;color:var(--mut)}
.meter{height:8px;background:var(--tint);border-radius:999px;margin:8px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--g);border-radius:999px}
.muted{color:var(--mut)}
.qr{display:flex;gap:14px;align-items:center}
.qrc{flex:none;width:96px;height:96px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:10px}
.qrc img,.qrc svg{width:100%;height:100%;display:block}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.links button,.links a{background:none;border:0;font:600 14px Inter;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px 0;min-height:32px}
.time{grid-column:1/-1;padding:20px 22px}
.time h3{font-size:15.5px;margin-bottom:18px}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative;list-style:none}
.steps:before{content:"";position:absolute;inset-inline:16px;top:15px;height:2px;background:var(--line)}
.steps .bar{position:absolute;inset-inline-start:16px;top:15px;height:2px;background:var(--g);transition:width .8s cubic-bezier(.16,1,.3,1)}
.st{position:relative;padding-inline-end:10px}
.st i{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--line);color:var(--mut);display:grid;place-items:center;font-style:normal;font-weight:700;position:relative}
.st.done i{background:var(--g);border-color:var(--g);color:#fff}
.st.now i{background:var(--t);border-color:var(--t);color:#fff;box-shadow:0 0 0 6px #f6ddd6}
.st b{display:block;margin-top:10px;font-weight:600;line-height:1.3}
.st small{color:var(--mut)}
.validate{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;background:var(--g);color:#fff;border-color:var(--g)}
.validate p{max-width:62ch;opacity:.9}
.validate .b{background:#fff;color:var(--g);border-color:#fff}
.empty{max-width:520px;margin:12vh auto;text-align:center;padding:0 20px}
.empty h1{font-size:26px;margin:16px 0 8px}
.empty img{width:46px}
.foot{text-align:center;color:var(--mut);font-size:13px;padding:0 16px 28px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;font-weight:600}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.reveal{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (max-width:1100px){.grid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:820px){.main{grid-template-columns:1fr}.side{grid-template-columns:1fr}
 .steps{grid-template-columns:1fr;gap:14px}.steps:before{inset-inline-start:15px;inset-inline-end:auto;width:2px;height:auto;top:16px;bottom:16px}
 .steps .bar{display:none}.st{display:grid;grid-template-columns:32px 1fr;column-gap:12px;align-items:center}.st b{margin:0}.st small{grid-column:2}
 .who .nm{display:none}.head .btns{width:100%}.head .b{flex:1 1 auto;justify-content:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    html += '<section class="card main reveal"><div class="prev ' + device + '" id="prev"><div class="devs" role="group">' +
      ["phone","laptop","desktop"].map(function (k) { return '<button type="button" data-dev="' + k + '" aria-pressed="' + (device === k) + '" aria-label="' + t(k) + '" title="' + t(k) + '">' + I[k] + '</button>'; }).join("") +
      '</div><div class="stage">' + (url ? '<iframe class="frame" id="frame" src="' + esc(url) + '" title="' + esc(name) + '" loading="lazy" tabindex="-1"></iframe>' : "") + '</div>' +
      (url ? '<a class="b dark open" href="' + esc(url) + '" target="_blank" rel="noopener">' + t("openNew") + '</a>' : "") + '</div>' +
      '<div class="info"><div class="row"><div><div class="lab">' + t("status") + '</div><span class="status"><span class="dot ' + st[0] + '"></span>' + t(st[1]) + '</span>' + (ser ? '<span class="tag">' + t("serenite") + '</span>' : "") + '</div>' +
      '<div><div class="lab">' + t("style") + '</div><div class="val">' + esc(d.style || "—") + '</div></div></div>' +
      '<div class="row"><div><div class="lab">' + t("created") + '</div><div class="val">' + fmt(d.created) + '</div></div><div><div class="lab">' + t("updated") + '</div><div class="val">' + rel(d.updated) + '</div></div></div>' +
      '<div><div class="lab">' + t("domains") + '</div>' + domains + '</div>' +
      (d.domainUntil ? '<div><div class="lab">' + t("until") + '</div><div class="val">' + fmt(d.domainUntil) + '</div></div>' : "") + '</div></section>';

    html += '<div class="side">';
    if (ser) {
      var max = s.modsMax || 2, used = Math.min(max, s.modsUsed || 0);
      html += '<section class="card box reveal"><h3 class="h">' + t("subTitle") + '<span class="pill ' + (s.paid ? "s-active" : "s-pending") + '">' + t(s.paid ? "paid" : "unpaid") + '</span></h3><div class="price">' + (s.price || 300) + ' DH <small>' + t("month") + '</small></div>' +
        (s.nextPayment ? '<div class="muted" style="margin-top:4px">' + t("next") + ' ' + fmt(s.nextPayment) + '</div>' : "") +
        '<div class="lab" style="margin-top:14px">' + t("mods") + '</div><div class="meter"><i style="width:' + (used / max * 100) + '%"></i></div><div class="val">' + used + ' / ' + max + ' ' + t("used") + '</div></section>';
    } else {
      html += '<section class="card box reveal"><h3 class="h">' + t("upTitle") + '<span class="pill s-demo">300 DH ' + t("month") + '</span></h3><p class="muted">' + t("upText") + '</p><p style="margin-top:12px"><a class="b" href="' + wa(t("msgSer")(name)) + '" target="_blank" rel="noopener">' + t("upBtn") + '</a></p></section>';
    }
    if (url) html += '<section class="card box reveal"><h3 class="h">' + t("share") + '</h3><div class="qr"><div class="qrc" id="qr" aria-label="QR code"></div><div class="muted">' + t("shareText") +
      '<div class="links"><button type="button" id="copy">' + t("copy") + '</button><a href="https://wa.me/?text=' + encodeURIComponent(t("msgShare")(name, url)) + '" target="_blank" rel="noopener">' + t("send") + '</a></div></div></div></section>';
    html += '</div>';

    html += '<section class="card time reveal"><h3 class="h">' + t("progress") + '</h3><ol class="steps"><span class="bar" style="width:' + (Math.max(0, doneIdx) / 6 * 100) + '%"></span>' +
      STEPS.map(function (k, i) {
        var date = d.steps && d.steps[k], cls = i < doneIdx ? "done" : i === doneIdx ? "now" : "";
        return '<li class="st ' + cls + '"><i>' + (i <= doneIdx ? "✓" : i + 1) + '</i><b>' + t("s_" + k) + '</b><small>' + (date ? short(date) : t("soon")) + '</small></li>';
      }).join("") + '</ol></section></div>';

    app.innerHTML = html;

    var q = document.getElementById("qr");
    if (q && window.qrcode) { try { var qr = qrcode(0, "M"); qr.addData(url); qr.make(); q.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) {} }
    var c = document.getElementById("copy");
    if (c) c.addEventListener("click", function () { (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { toast(t("copied")); }, function () { prompt("", url); }); });
    app.querySelectorAll("[data-dev]").forEach(function (b) { b.addEventListener("click", function () { device = b.getAttribute("data-dev"); render(); }); });
    fit();
  }

  // Scale the iframe so the page renders at a real device width inside the preview box.
  function fit() {
    var box = document.getElementById("prev"), f = document.getElementById("frame");
    if (!box || !f) return;
    var W = { phone:390, laptop:1280, desktop:1680 }[device], H = { phone:780, laptop:800, desktop:1050 }[device];
    var bw = box.clientWidth, bh = box.clientHeight;
    var sc = device === "phone" ? Math.min(1, (bh - 36) / H) : bw / W;
    f.style.width = W + "px"; f.style.height = (device === "phone" ? H : bh / sc) + "px"; f.style.transform = "scale(" + sc + ")";
  }
  window.addEventListener("resize", fit);

  applyLang();
  var m = location.pathname.match(/\/espace\/([a-z0-9]{8,32})\/?$/i) || [null, new URLSearchParams(location.search).get("c")];
  var code = (m[1] || "").toLowerCase();
  if (!/^[a-z0-9]{8,32}$/.test(code)) { notFound(); return; }
  fetch("/espace/clients/" + code + ".json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) { data = j; render(); }, notFound);
})();
</script>
</body>
</html>
